name: Deploy to Cloud Run

# 曾經有 push 自動觸發(branches: [main], paths: server/**、web/** 等),
# 已移除:2026-08 channel→trip 改名這批改動需要先執行資料庫遷移
# (rename-channel-to-trip)才能讓新程式碼正常運作,若 push 到 main 就自動
# build+deploy,會在資料庫還沒改名的狀態下把讀新 schema 的程式碼推上線,
# 直接壞掉。之後若確定某類改動不涉及資料庫 schema、可以安全自動部署,
# 再評估要不要恢復 push 觸發(且應排除有資料庫遷移依賴的那類 commit,
# 但 workflow 层級無法可靠自動判斷這件事,見 deploy-with-migration.yml
# 開頭的說明)。
#
# 改為打 v* 格式的 git tag(如 v1.0.2)時自動觸發部署——對齊
# .claude/skills/version-tagging 的打版號流程:CHANGELOG 寫好、版號
# 決定後才打 tag,這裡直接把「打 tag」當成「這個版本已經確認要上線」的
# 訊號,不需要再額外手動觸發一次部署。tag 部署一律用完整流程(build +
# deploy),沒有 skip_build 選項——那是給手動觸發時「只想重新指向某個
# 已存在 image」的特殊情境用,tag 觸發的語意就是「這個版本要重新
# build 上線」,不該省略 build。
#
# workflow_dispatch 仍保留,供不方便打 tag、或需要 skip_build 這種
# 特殊情境時手動觸發,兩種觸發方式並存。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      skip_build:
        description: '只部署不重新 build（使用現有 latest image）'
        type: boolean
        default: false

env:
  GCP_PROJECT_ID: "shuttle-045094509"
  CLOUD_RUN_SERVICE: "tripace-server"
  CLOUD_RUN_REGION: "asia-east1"
  IMAGE: "asia-east1-docker.pkg.dev/shuttle-045094509/cloud-run-source-deploy/tripace-server"
  CLOUDSQL_INSTANCE: "onagent-prod:asia-east1:onagent-db"

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker asia-east1-docker.pkg.dev --quiet

      # 前端 build 期間需要讀到 VITE_GOOGLE_MAPS_API_KEY(見 Dockerfile 的
      # web-build 階段),這把 key 放 Secret Manager 而非 GitHub Secrets(理由
      # 見 server/scripts/update-secret-manager.sh 的說明:換 key 只需更新
      # Secret Manager 版本,不需要另外同步 GitHub Secrets)。這裡讀出來後
      # 立刻 ::add-mask:: 遮罩,避免明文出現在 job log 裡。
      - name: Read Google Maps API key from Secret Manager
        id: maps_key
        run: |
          KEY=$(gcloud secrets versions access latest --secret=GOOGLE_MAPS_API_KEY --project=${{ env.GCP_PROJECT_ID }})
          echo "::add-mask::$KEY"
          echo "key=$KEY" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        run: |
          docker build \
            --build-arg GH_PAT=${{ secrets.GH_PAT }} \
            --build-arg VITE_GOOGLE_MAPS_API_KEY=${{ steps.maps_key.outputs.key }} \
            -t ${{ env.IMAGE }}:${{ github.sha }} \
            -t ${{ env.IMAGE }}:latest \
            .

      - name: Push image
        run: |
          docker push ${{ env.IMAGE }}:${{ github.sha }}
          docker push ${{ env.IMAGE }}:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.CLOUD_RUN_SERVICE }} \
            --image=${{ env.IMAGE }}:${{ github.sha }} \
            --region=${{ env.CLOUD_RUN_REGION }} \
            --allow-unauthenticated \
            --add-cloudsql-instances=${{ env.CLOUDSQL_INSTANCE }} \
            --update-env-vars=DEV_MODE=false,SEED=false,AI_PROVIDER=googleapis,AI_MODEL=gemini-2.5-flash-lite \
            --update-secrets=DATABASE_URL=DATABASE_URL:latest,JWT_SECRET=JWT_SECRET:latest,GOOGLE_API_KEY=GOOGLE_API_KEY:latest,GOOGLE_PLACES_API_KEY=GOOGLE_PLACES_API_KEY:latest \
            --quiet

      - name: Show Cloud Run URL
        run: |
          URL=$(gcloud run services describe ${{ env.CLOUD_RUN_SERVICE }} \
            --region ${{ env.CLOUD_RUN_REGION }} \
            --format 'value(status.url)')
          echo "### 部署完成" >> "$GITHUB_STEP_SUMMARY"
          echo "URL: $URL" >> "$GITHUB_STEP_SUMMARY"
          echo "$URL"
