name: Deploy to Cloud Run

# 曾經有 push 自動觸發(branches: [main], paths: server/**、web/** 等),
# 已移除:2026-08 channel→trip 改名這批改動需要先執行資料庫遷移
# (rename-channel-to-trip)才能讓新程式碼正常運作,若 push 到 main 就自動
# build+deploy,會在資料庫還沒改名的狀態下把讀新 schema 的程式碼推上線,
# 直接壞掉。之後若確定某類改動不涉及資料庫 schema、可以安全自動部署,
# 再評估要不要恢復 push 觸發(且應排除有資料庫遷移依賴的那類 commit,
# 但 workflow 层級無法可靠自動判斷這件事,見 deploy-with-migration.yml
# 開頭的說明)。
#
# 改為打 v* 格式的 git tag(如 v1.0.2)時自動觸發部署——對齊
# .claude/skills/version-tagging 的打版號流程:CHANGELOG 寫好、版號
# 決定後才打 tag,這裡直接把「打 tag」當成「這個版本已經確認要上線」的
# 訊號,不需要再額外手動觸發一次部署。tag push 觸發時 github.event_name
# 是 "push",不是 "workflow_dispatch",故下方 skip_build 的 if 判斷天生
# 只會在手動觸發時生效,tag 部署一律走完整 build+deploy,不需要另外排除。
#
# workflow_dispatch 仍保留,供不方便打 tag、或只是想重新指向現有 image
# (skip_build=true)時手動觸發,兩種觸發方式並存。skip_build=true 時
# 會跳過 Configure Docker/讀 key/Build/Push 四個步驟,Deploy 改用
# Artifact Registry 裡現有的 :latest image(而非 :${{ github.sha }}——
# 沒有 build 過,這次 sha 對應的 image 根本不存在)。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      skip_build:
        description: '只部署不重新 build（使用現有 latest image）'
        type: boolean
        default: false

env:
  GCP_PROJECT_ID: "shuttle-045094509"
  CLOUD_RUN_SERVICE: "tripace-server"
  CLOUD_RUN_REGION: "asia-east1"
  IMAGE: "asia-east1-docker.pkg.dev/shuttle-045094509/cloud-run-source-deploy/tripace-server"
  CLOUDSQL_INSTANCE: "onagent-prod:asia-east1:onagent-db"

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      # skip_build 只在 workflow_dispatch 觸發時才可能是 true(tag push 觸發
      # 沒有這個 input,github.event.inputs.skip_build 會是空字串,
      # != 'true' 成立,以下四個步驟正常執行)。
      - name: Configure Docker for Artifact Registry
        if: github.event.inputs.skip_build != 'true'
        run: gcloud auth configure-docker asia-east1-docker.pkg.dev --quiet

      # 前端 build 期間需要讀到 VITE_GOOGLE_MAPS_API_KEY(見 Dockerfile 的
      # web-build 階段),這把 key 放 Secret Manager 而非 GitHub Secrets(理由
      # 見 server/scripts/update-secret-manager.sh 的說明:換 key 只需更新
      # Secret Manager 版本,不需要另外同步 GitHub Secrets)。這裡讀出來後
      # 立刻 ::add-mask:: 遮罩,避免明文出現在 job log 裡。
      - name: Read Google Maps API key from Secret Manager
        if: github.event.inputs.skip_build != 'true'
        id: maps_key
        run: |
          KEY=$(gcloud secrets versions access latest --secret=GOOGLE_MAPS_API_KEY --project=${{ env.GCP_PROJECT_ID }})
          echo "::add-mask::$KEY"
          echo "key=$KEY" >> "$GITHUB_OUTPUT"

      # VITE_GOOGLE_MAPS_MAP_ID:GeoOutlineMap.tsx 的 AdvancedMarkerElement
      # 要求地圖必須帶 mapId 才能運作(見 Dockerfile 的說明),對應 GCP
      # Console 手動建立的 Map Style ID。不是機密資料,放 Secret Manager
      # 純粹是集中管理(見 update-secret-manager.sh 的說明),遮罩只是沿用
      # 跟其他 secret 一致的處理方式。
      - name: Read Google Maps Map ID from Secret Manager
        if: github.event.inputs.skip_build != 'true'
        id: maps_map_id
        run: |
          MAP_ID=$(gcloud secrets versions access latest --secret=GOOGLE_MAPS_MAP_ID --project=${{ env.GCP_PROJECT_ID }})
          echo "::add-mask::$MAP_ID"
          echo "map_id=$MAP_ID" >> "$GITHUB_OUTPUT"

      # VITE_GOOGLE_MAPS_LANDING_MAP_ID:主題介紹頁地圖(九份/京都/台南
      # 安平/赤崁・府城)專用的 Cloud Style Map ID,見 Dockerfile 該 ARG
      # 的完整說明。同上面 GOOGLE_MAPS_MAP_ID,不是機密但集中放 Secret
      # Manager 管理。
      - name: Read Google Maps Landing Map ID from Secret Manager
        if: github.event.inputs.skip_build != 'true'
        id: maps_landing_map_id
        run: |
          LANDING_MAP_ID=$(gcloud secrets versions access latest --secret=GOOGLE_MAPS_LANDING_MAP_ID --project=${{ env.GCP_PROJECT_ID }})
          echo "::add-mask::$LANDING_MAP_ID"
          echo "landing_map_id=$LANDING_MAP_ID" >> "$GITHUB_OUTPUT"

      # onagent 平台(tripace app)的 apiKey,同上放 Secret Manager 而非
      # GitHub Secrets(見 server/scripts/update-secret-manager.sh
      # -cleanup-legacy-provider 附近的說明——這把 key 只顯示一次、重發會讓
      # 舊 key 立刻失效,不支援現場申請,只能貼上既有值寫入 Secret Manager)。
      - name: Read onagent app key from Secret Manager
        if: github.event.inputs.skip_build != 'true'
        id: onagent_key
        run: |
          KEY=$(gcloud secrets versions access latest --secret=VITE_ONAGENT_APP_KEY --project=${{ env.GCP_PROJECT_ID }})
          echo "::add-mask::$KEY"
          echo "key=$KEY" >> "$GITHUB_OUTPUT"

      # VITE_GOOGLE_OAUTH_CLIENT_ID:Google 登入(GSI 模式)用的 OAuth 用戶端
      # ID，見 Dockerfile 該 ARG 的說明。同 GOOGLE_MAPS_MAP_ID，不是機密但
      # 集中放 Secret Manager 管理。
      - name: Read Google OAuth client ID from Secret Manager
        if: github.event.inputs.skip_build != 'true'
        id: google_oauth_client_id
        run: |
          CLIENT_ID=$(gcloud secrets versions access latest --secret=GOOGLE_OAUTH_CLIENT_ID --project=${{ env.GCP_PROJECT_ID }})
          echo "::add-mask::$CLIENT_ID"
          echo "client_id=$CLIENT_ID" >> "$GITHUB_OUTPUT"

      # onagent 平台上「AI 規劃」功能(/app/plan-ai)專用的獨立 app
      # (plan-ai-timeline)的 apiKey，跟上面的 VITE_ONAGENT_APP_KEY
      # (tripace app)是完全不同的兩個 app、兩把互不相關的 key，見
      # web/src/trip-plan/TripPlanPage.tsx PLAN_AI_ONAGENT_APP_ID 的完整
      # 說明。apiKey 只顯示一次、重發會讓舊 key 立刻失效，不支援現場申請，
      # 只能貼上既有值寫入 Secret Manager(見
      # server/scripts/update-secret-manager.sh 的 -plan-ai-onagent 選項)。
      # 這個 app 的 URL 2026-09 起共用上面 tripace app 的 VITE_ONAGENT_URL
      # (見下方 Build Docker image 步驟同一個 --build-arg)，不再有獨立的
      # 環境變數/secret。
      - name: Read plan-ai onagent app key from Secret Manager
        if: github.event.inputs.skip_build != 'true'
        id: plan_ai_onagent_key
        run: |
          KEY=$(gcloud secrets versions access latest --secret=VITE_PLAN_AI_ONAGENT_APP_KEY --project=${{ env.GCP_PROJECT_ID }})
          echo "::add-mask::$KEY"
          echo "key=$KEY" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        if: github.event.inputs.skip_build != 'true'
        run: |
          docker build \
            --build-arg VITE_GOOGLE_MAPS_API_KEY=${{ steps.maps_key.outputs.key }} \
            --build-arg VITE_GOOGLE_MAPS_MAP_ID=${{ steps.maps_map_id.outputs.map_id }} \
            --build-arg VITE_GOOGLE_MAPS_LANDING_MAP_ID=${{ steps.maps_landing_map_id.outputs.landing_map_id }} \
            --build-arg VITE_ONAGENT_APP_KEY=${{ steps.onagent_key.outputs.key }} \
            --build-arg VITE_ONAGENT_URL="https://onagent.shuttle.tools" \
            --build-arg VITE_GOOGLE_OAUTH_CLIENT_ID=${{ steps.google_oauth_client_id.outputs.client_id }} \
            --build-arg VITE_PLAN_AI_ONAGENT_APP_KEY=${{ steps.plan_ai_onagent_key.outputs.key }} \
            -t ${{ env.IMAGE }}:${{ github.sha }} \
            -t ${{ env.IMAGE }}:latest \
            .

      - name: Push image
        if: github.event.inputs.skip_build != 'true'
        run: |
          docker push ${{ env.IMAGE }}:${{ github.sha }}
          docker push ${{ env.IMAGE }}:latest

      # skip_build=true 時本次沒有 build 過,${{ github.sha }} 這個 tag 根本
      # 不存在於 Artifact Registry,故改用 :latest(見上方 Push image 步驟,
      # 只要之前任何一次完整 build+deploy 跑過,:latest 就會是那次的內容)。
      - name: Deploy to Cloud Run
        run: |
          # 把 --update-env-vars/--update-secrets 各自要帶的清單拆成
          # shell 變數、一行一項組裝——純粹是可讀性/之後增刪項目時
          # diff 更乾淨的考量,傳給 gcloud 的實際值跟原本逗號串接寫死
          # 在同一行完全等價,不影響部署行為本身。
          ENV_VARS="DEV_MODE=false"
          ENV_VARS="${ENV_VARS},SEED=false"
          ENV_VARS="${ENV_VARS},GOOGLE_PLACES_GET_RATE_LIMIT_WINDOW_SEC=10"
          ENV_VARS="${ENV_VARS},GOOGLE_PLACES_GET_RATE_LIMIT_MAX_CALLS=1"
          ENV_VARS="${ENV_VARS},GOOGLE_PLACES_PHOTO_MEDIA_RATE_LIMIT_WINDOW_SEC=600"
          ENV_VARS="${ENV_VARS},GOOGLE_PLACES_PHOTO_MEDIA_RATE_LIMIT_MAX_CALLS=1"

          SECRETS="DATABASE_URL=DATABASE_URL:latest"
          SECRETS="${SECRETS},JWT_SECRET=JWT_SECRET:latest"
          SECRETS="${SECRETS},GOOGLE_PLACES_API_KEY=GOOGLE_PLACES_API_KEY:latest"
          SECRETS="${SECRETS},PEXELS_API_KEY=PEXELS_API_KEY:latest"
          SECRETS="${SECRETS},GOOGLE_OAUTH_CLIENT_ID=GOOGLE_OAUTH_CLIENT_ID:latest"
          # GCS_PHOTO_BUCKET:2026-09 補上——主服務(photostorage.New,見
          # server/internal/api/api.go 的 New() 建構子)一直需要這個
          # 環境變數才能把漸進補圖機制下載到的新照片落地到 GCS/寫入
          # photo_assets,先前這裡漏掛,導致正式環境的 GCS_PHOTO_BUCKET
          # 一直是空字串,photostorage.New 回傳的是空殼 Uploader
          # (bucket==""),任何新照片都無法落地,只有透過
          # cmd/migrate-photo-assets 一次性遷移進 photo_assets 的舊
          # 照片能顯示,之後所有需要「補圖」的地點永久補不上(實測發現
          # 的真實 bug)。
          SECRETS="${SECRETS},GCS_PHOTO_BUCKET=GCS_PHOTO_BUCKET:latest"

          gcloud run deploy ${{ env.CLOUD_RUN_SERVICE }} \
            --image=${{ env.IMAGE }}:${{ github.event.inputs.skip_build == 'true' && 'latest' || github.sha }} \
            --region=${{ env.CLOUD_RUN_REGION }} \
            --allow-unauthenticated \
            --add-cloudsql-instances=${{ env.CLOUDSQL_INSTANCE }} \
            --update-env-vars="${ENV_VARS}" \
            --update-secrets="${SECRETS}" \
            --quiet

      - name: Show Cloud Run URL
        run: |
          URL=$(gcloud run services describe ${{ env.CLOUD_RUN_SERVICE }} \
            --region ${{ env.CLOUD_RUN_REGION }} \
            --format 'value(status.url)')
          echo "### 部署完成" >> "$GITHUB_STEP_SUMMARY"
          echo "URL: $URL" >> "$GITHUB_STEP_SUMMARY"
          echo "$URL"
