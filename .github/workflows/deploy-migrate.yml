name: Build and Run Migrate Job

# 這支 workflow 建置 tripace-migrate 這個 Cloud Run Job 的映像檔、更新
# Job 定義,並(可選)立即執行一次。跟 deploy-cloudrun.yml/deploy-admin.yml
# 的 gcloud run deploy(Service,常駐處理流量)不同,這裡用的是
# gcloud run jobs(執行完就結束、不留常駐 instance,見 Dockerfile.migrate
# 的說明)。
#
# 不設 push 觸發:這是一次性維運工具,不該每次 push 到 main 就重跑一次
# 資料庫維運操作(即使 drop-legacy-columns 本身是冪等的,其他未來可能加
# 進來的維運操作不一定冪等)。只能手動觸發(workflow_dispatch),且需要
# 明確指定要執行的子命令與參數,避免誤觸發。

on:
  workflow_dispatch:
    inputs:
      cli_args:
        description: '要傳給 cmd/cli 的完整參數(例如: -db drop-legacy-columns)。留空則只執行備份、不建置/部署/執行 migrate job(搭配 backup_first 單獨測試或單獨備份用)'
        type: string
        required: false
      run_now:
        description: '建置/更新 Job 定義後是否立即執行一次(cli_args 留空時這個選項不生效)'
        type: boolean
        default: true
      backup_first:
        description: '先用 gcloud sql export 備份一份到 GCS(強烈建議對有結構性變更的指令保持勾選)'
        type: boolean
        default: true

env:
  GCP_PROJECT_ID: "shuttle-045094509"
  CLOUD_RUN_REGION: "asia-east1"
  JOB_NAME: "tripace-migrate"
  IMAGE: "asia-east1-docker.pkg.dev/shuttle-045094509/cloud-run-source-deploy/tripace-migrate"
  CLOUDSQL_INSTANCE: "onagent-prod:asia-east1:onagent-db"
  CLOUDSQL_INSTANCE_ID: "onagent-db" # gcloud sql export/instances 系列指令只吃 instance 短名,不含 project:region 前綴
  # onagent-db 這個 Cloud SQL 實例本身是建在 onagent-prod 專案下(跟這支
  # workflow 主要操作的 shuttle-045094509 是不同專案,只是共用同一個
  # WIF 服務帳號有跨專案權限)——CLOUDSQL_INSTANCE 那個完整格式字串本身
  # 已經內含 "onagent-prod:..." 前綴,gcloud run jobs deploy 的
  # --set-cloudsql-instances 吃這種完整格式沒問題;但 gcloud sql
  # instances describe / gcloud sql export 這兩支「直接對 Cloud SQL API
  # 操作」的指令只吃 instance 短名,必須另外用 --project 明講去哪個專案
  # 找,不能沿用 GCP_PROJECT_ID(那是 shuttle-045094509,實測會得到
  # HTTPError 404 The Cloud SQL instance does not exist)。
  CLOUDSQL_PROJECT_ID: "onagent-prod"
  BACKUP_BUCKET: "tripace-db-backups"

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      # 從 Secret Manager 讀出正式站的 DATABASE_URL,解析出資料庫名稱。
      # 之所以不能直接硬編碼成 "tripace":本機開發環境的 database 叫
      # tripace,但正式站是否同名並不保證,唯一可信的來源是既有的
      # DATABASE_URL secret(Deploy/update Cloud Run Job 步驟本身也是
      # 用這個 secret 掛進 Job 的)。DSN 常見兩種格式:
      #   postgresql://USER:PASSWORD@HOST/DBNAME?sslmode=require
      #   postgresql://USER:PASSWORD@/DBNAME?host=/cloudsql/xxx
      # 兩種格式的資料庫名稱都位在「最後一個 /」之後、「?」之前,故用
      # 這個規則解析即可涵蓋。解析失敗(空字串)時明確讓 job fail,避免
      # 後續備份步驟拿著空字串繼續跑、產生更難懂的錯誤。
      - name: Resolve database name from DATABASE_URL secret
        if: ${{ inputs.backup_first }}
        id: resolve-db
        run: |
          set -euo pipefail
          DSN="$(gcloud secrets versions access latest --secret=DATABASE_URL --project=${{ env.GCP_PROJECT_ID }})"

          # 去掉 querystring(? 之後的部分),再取最後一個 / 之後的內容
          DSN_NO_QUERY="${DSN%%\?*}"
          DB_NAME="${DSN_NO_QUERY##*/}"

          if [ -z "$DB_NAME" ]; then
            echo "::error::無法從 DATABASE_URL 解析出資料庫名稱,DSN 格式可能不符預期,請確認 Secret Manager 內的 DATABASE_URL 內容。"
            exit 1
          fi

          echo "db_name=${DB_NAME}" >> "$GITHUB_OUTPUT"

      # bucket 是否已存在的冪等檢查:優先用 describe 判斷存不存在,再決定
      # 要不要 create。之所以不用 `gcloud storage buckets create
      # --if-not-exists`,是因為不確定目前 gcloud CLI 版本是否支援這個
      # flag、以及它的實際行為是否符合預期,改用「先檢查再建立」這種較
      # 保守、肯定冪等的寫法。
      - name: Ensure GCS bucket for DB backups exists
        if: ${{ inputs.backup_first }}
        run: |
          set -euo pipefail
          if gcloud storage buckets describe "gs://${{ env.BACKUP_BUCKET }}" --project=${{ env.GCP_PROJECT_ID }} >/dev/null 2>&1; then
            echo "Bucket gs://${{ env.BACKUP_BUCKET }} 已存在,略過建立。"
          else
            echo "Bucket gs://${{ env.BACKUP_BUCKET }} 不存在,建立中..."
            gcloud storage buckets create "gs://${{ env.BACKUP_BUCKET }}" \
              --project=${{ env.GCP_PROJECT_ID }} \
              --location=${{ env.CLOUD_RUN_REGION }}
          fi

      # gcloud sql export 是用 Cloud SQL 實例自己的服務帳號寫入 GCS,
      # 不是用這支 workflow 的 WIF 服務帳號,因此需要額外把 bucket 的
      # 寫入權限授予給它。IAM 綁定本身是冪等操作(重複 add 同一個
      # binding 不會出錯),不需要額外判斷是否已存在。
      - name: Grant Cloud SQL service account write access to backup bucket
        if: ${{ inputs.backup_first }}
        run: |
          set -euo pipefail
          SQL_SA="$(gcloud sql instances describe ${{ env.CLOUDSQL_INSTANCE_ID }} \
            --project=${{ env.CLOUDSQL_PROJECT_ID }} \
            --format='value(serviceAccountEmailAddress)')"

          if [ -z "$SQL_SA" ]; then
            echo "::error::無法取得 Cloud SQL 實例 ${{ env.CLOUDSQL_INSTANCE_ID }} 的服務帳號 email。"
            exit 1
          fi

          gcloud storage buckets add-iam-policy-binding "gs://${{ env.BACKUP_BUCKET }}" \
            --member="serviceAccount:${SQL_SA}" \
            --role="roles/storage.objectAdmin"

      # 正式備份:gcloud sql export sql 預設是同步阻塞直到匯出完成才
      # 返回(不像 run jobs execute 需要額外 --wait),因此不需要另外加
      # 等待邏輯。也不特別縮短這個 step 的 timeout——沿用 job 預設值,
      # 避免正式資料庫較大、匯出耗時較久時被誤判為逾時失敗。
      - name: Backup Cloud SQL database before migration
        if: ${{ inputs.backup_first }}
        id: backup
        run: |
          set -euo pipefail
          TIMESTAMP="$(date -u +%Y%m%d_%H%M%S)"
          BACKUP_URI="gs://${{ env.BACKUP_BUCKET }}/tripace-backup-${TIMESTAMP}.sql"

          gcloud sql export sql ${{ env.CLOUDSQL_INSTANCE_ID }} "${BACKUP_URI}" \
            --project=${{ env.CLOUDSQL_PROJECT_ID }} \
            --database=${{ steps.resolve-db.outputs.db_name }}

          echo "backup_uri=${BACKUP_URI}" >> "$GITHUB_OUTPUT"
          echo "備份完成: ${BACKUP_URI}"

      # 以下 4 個 step 只在有帶 cli_args 時才需要執行——留空代表這次只是
      # 想單獨測試/執行備份,不需要為了「什麼都不做的 migrate job」跑一次
      # 建置/部署,那既浪費時間也沒有意義。
      - name: Configure Docker for Artifact Registry
        if: ${{ inputs.cli_args != '' }}
        run: gcloud auth configure-docker asia-east1-docker.pkg.dev --quiet

      - name: Build Docker image
        if: ${{ inputs.cli_args != '' }}
        run: |
          docker build \
            -f Dockerfile.migrate \
            -t ${{ env.IMAGE }}:${{ github.sha }} \
            -t ${{ env.IMAGE }}:latest \
            .

      - name: Push image
        if: ${{ inputs.cli_args != '' }}
        run: |
          docker push ${{ env.IMAGE }}:${{ github.sha }}
          docker push ${{ env.IMAGE }}:latest

      # gcloud run jobs deploy:第一次執行會建立 Job,之後執行是更新既有
      # Job 的定義(映像檔版本、指令參數)——跟 run jobs create 不同,
      # deploy 是「建立或更新」的冪等操作,不需要另外判斷 Job 存不存在。
      - name: Deploy/update Cloud Run Job
        if: ${{ inputs.cli_args != '' }}
        run: |
          gcloud run jobs deploy ${{ env.JOB_NAME }} \
            --image=${{ env.IMAGE }}:${{ github.sha }} \
            --region=${{ env.CLOUD_RUN_REGION }} \
            --set-cloudsql-instances=${{ env.CLOUDSQL_INSTANCE }} \
            --update-secrets=DATABASE_URL=DATABASE_URL:latest \
            --args="$(echo '${{ inputs.cli_args }}' | tr ' ' ',')" \
            --max-retries=0 \
            --task-timeout=300 \
            --quiet

      - name: Execute Job now
        if: ${{ inputs.cli_args != '' && inputs.run_now }}
        run: |
          gcloud run jobs execute ${{ env.JOB_NAME }} \
            --region=${{ env.CLOUD_RUN_REGION }} \
            --wait \
            --quiet

      - name: Show execution logs link
        if: ${{ inputs.cli_args != '' && inputs.run_now }}
        run: |
          echo "### Migrate Job 執行完成" >> "$GITHUB_STEP_SUMMARY"
          echo "參數: \`${{ inputs.cli_args }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "查看完整 log:" >> "$GITHUB_STEP_SUMMARY"
          echo "https://console.cloud.google.com/run/jobs/details/${{ env.CLOUD_RUN_REGION }}/${{ env.JOB_NAME }}/executions?project=${{ env.GCP_PROJECT_ID }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Show backup location in summary
        if: ${{ inputs.backup_first }}
        run: |
          echo "備份檔案位置: \`${{ steps.backup.outputs.backup_uri }}\`" >> "$GITHUB_STEP_SUMMARY"
