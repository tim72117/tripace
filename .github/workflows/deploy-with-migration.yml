name: Deploy with DB Migration

# 用於「這次部署需要先執行資料庫結構性遷移,程式碼才能正常運作」的情境
# ——例如 channel→trip 改名(entries/members/public_links 的 channel_id
# 欄位改名 trip_id,見 server/internal/store/maintenance.go 的
# RenameChannelToTrip)。deploy-cloudrun.yml(單純部署 tripace-server)與
# deploy-migrate.yml(單純跑 cmd/cli 維運指令)兩支都無法安全處理這種
# 「順序耦合」的情境:如果先部署新程式碼、資料庫還沒遷移,新程式碼會找
# 不到新 schema 直接壞掉;如果只遷移不部署,舊程式碼會找不到舊 schema
# 一樣壞掉。這支 workflow 把正確順序(備份→遷移→立即部署新版)串成一次
# 執行,把兩步之間的中斷窗口壓到最短。
#
# Cloud Run 沒有「暫停流量但服務仍活著」的模式,`gcloud run deploy`
# 本身就是 build 完立刻切 100% 流量,沒有 --no-traffic 這種分階段選項
# 可用於這裡的場景(要分階段還要另外設計 traffic splitting,複雜度不成
# 比例,見這次規劃討論的取捨)。故這裡採用的策略是:資料庫遷移一結束就
# 立刻部署新版本,中斷窗口就是「遷移完成」到「新 revision 開始接手流量」
# 這段時間差,而不是插入任何額外的「暫停」步驟。
#
# 不設 push 自動觸發,理由同 deploy-cloudrun.yml 開頭的說明:
# 這類部署有嚴格的執行順序要求與破壞性(改資料庫結構),必須人工確認
# 時機、明確帶上要執行的遷移指令才能觸發,不能讓 CI 自己判斷「這次
# push 需不需要遷移」。

on:
  workflow_dispatch:
    inputs:
      migration_cli_args:
        description: '要執行的資料庫遷移指令(例如: -db rename-channel-to-trip)，會透過 tripace-migrate Job 執行'
        type: string
        required: true
      backup_first:
        description: '遷移前先用 gcloud sql export 備份一份到 GCS(強烈建議保持勾選)'
        type: boolean
        default: true

env:
  GCP_PROJECT_ID: "shuttle-045094509"
  CLOUD_RUN_REGION: "asia-east1"
  CLOUD_RUN_SERVICE: "tripace-server"
  MIGRATE_JOB_NAME: "tripace-migrate"
  SERVER_IMAGE: "asia-east1-docker.pkg.dev/shuttle-045094509/cloud-run-source-deploy/tripace-server"
  MIGRATE_IMAGE: "asia-east1-docker.pkg.dev/shuttle-045094509/cloud-run-source-deploy/tripace-migrate"
  CLOUDSQL_INSTANCE: "onagent-prod:asia-east1:onagent-db"
  CLOUDSQL_INSTANCE_ID: "onagent-db"
  # onagent-db 建在 onagent-prod 專案下(跟這支 workflow 主要操作的
  # shuttle-045094509 是不同專案)。gcloud run 系列指令吃 CLOUDSQL_INSTANCE
  # 這種完整格式沒問題,但 gcloud sql instances/export 這類直接對 Cloud SQL
  # API 操作的指令需要另外用 --project 指定 onagent-prod,實測對
  # shuttle-045094509 會得到 HTTPError 404(見 deploy-migrate.yml 同一個
  # 註解與踩過的坑)。
  CLOUDSQL_PROJECT_ID: "onagent-prod"
  BACKUP_BUCKET: "tripace-db-backups"

jobs:
  deploy-with-migration:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker asia-east1-docker.pkg.dev --quiet

      # ---- 階段一:預備(這裡的步驟不影響正在運行的正式站,可以放心花時間) ----

      - name: Resolve database name from DATABASE_URL secret
        if: ${{ inputs.backup_first }}
        id: resolve-db
        run: |
          set -euo pipefail
          DSN="$(gcloud secrets versions access latest --secret=DATABASE_URL --project=${{ env.GCP_PROJECT_ID }})"
          DSN_NO_QUERY="${DSN%%\?*}"
          DB_NAME="${DSN_NO_QUERY##*/}"
          if [ -z "$DB_NAME" ]; then
            echo "::error::無法從 DATABASE_URL 解析出資料庫名稱,請確認 Secret Manager 內容。"
            exit 1
          fi
          echo "db_name=${DB_NAME}" >> "$GITHUB_OUTPUT"

      - name: Ensure GCS bucket for DB backups exists
        if: ${{ inputs.backup_first }}
        run: |
          set -euo pipefail
          if gcloud storage buckets describe "gs://${{ env.BACKUP_BUCKET }}" --project=${{ env.GCP_PROJECT_ID }} >/dev/null 2>&1; then
            echo "Bucket gs://${{ env.BACKUP_BUCKET }} 已存在,略過建立。"
          else
            gcloud storage buckets create "gs://${{ env.BACKUP_BUCKET }}" \
              --project=${{ env.GCP_PROJECT_ID }} \
              --location=${{ env.CLOUD_RUN_REGION }}
          fi

      - name: Grant Cloud SQL service account write access to backup bucket
        if: ${{ inputs.backup_first }}
        run: |
          set -euo pipefail
          SQL_SA="$(gcloud sql instances describe ${{ env.CLOUDSQL_INSTANCE_ID }} \
            --project=${{ env.CLOUDSQL_PROJECT_ID }} \
            --format='value(serviceAccountEmailAddress)')"
          if [ -z "$SQL_SA" ]; then
            echo "::error::無法取得 Cloud SQL 實例服務帳號 email。"
            exit 1
          fi
          gcloud storage buckets add-iam-policy-binding "gs://${{ env.BACKUP_BUCKET }}" \
            --member="serviceAccount:${SQL_SA}" \
            --role="roles/storage.objectAdmin"

      - name: Backup Cloud SQL database before migration
        if: ${{ inputs.backup_first }}
        id: backup
        run: |
          set -euo pipefail
          TIMESTAMP="$(date -u +%Y%m%d_%H%M%S)"
          BACKUP_URI="gs://${{ env.BACKUP_BUCKET }}/tripace-backup-${TIMESTAMP}.sql"
          gcloud sql export sql ${{ env.CLOUDSQL_INSTANCE_ID }} "${BACKUP_URI}" \
            --project=${{ env.CLOUDSQL_PROJECT_ID }} \
            --database=${{ steps.resolve-db.outputs.db_name }}
          echo "backup_uri=${BACKUP_URI}" >> "$GITHUB_OUTPUT"
          echo "備份完成: ${BACKUP_URI}"

      # 讀 GOOGLE_MAPS_API_KEY,server image build 期間前端需要它(對齊
      # deploy-cloudrun.yml 的既有做法)。
      - name: Read Google Maps API key from Secret Manager
        id: maps_key
        run: |
          KEY=$(gcloud secrets versions access latest --secret=GOOGLE_MAPS_API_KEY --project=${{ env.GCP_PROJECT_ID }})
          echo "::add-mask::$KEY"
          echo "key=$KEY" >> "$GITHUB_OUTPUT"

      # 新版 tripace-server image 先建置、推上 Artifact Registry 待命——
      # 這一步不影響正在運行的正式站(舊 revision 仍在處理流量),可以放心
      # 花時間 build,不需要搶時間。
      - name: Build new tripace-server image (staged, not deployed yet)
        run: |
          docker build \
            --build-arg VITE_GOOGLE_MAPS_API_KEY=${{ steps.maps_key.outputs.key }} \
            -t ${{ env.SERVER_IMAGE }}:${{ github.sha }} \
            -t ${{ env.SERVER_IMAGE }}:latest \
            .
          docker push ${{ env.SERVER_IMAGE }}:${{ github.sha }}
          docker push ${{ env.SERVER_IMAGE }}:latest

      # migrate job 的 image 同樣先建置待命。
      - name: Build tripace-migrate image (staged, not executed yet)
        run: |
          docker build \
            -f Dockerfile.migrate \
            -t ${{ env.MIGRATE_IMAGE }}:${{ github.sha }} \
            -t ${{ env.MIGRATE_IMAGE }}:latest \
            .
          docker push ${{ env.MIGRATE_IMAGE }}:${{ github.sha }}
          docker push ${{ env.MIGRATE_IMAGE }}:latest

      # ---- 階段二:切換窗口(以下步驟盡量緊湊執行,這是實際造成中斷的部分) ----
      #
      # 執行順序:遷移資料庫 → 立刻部署新版 tripace-server。中斷窗口就是
      # 這兩步之間的時間差(遷移完成到新 revision 開始接手流量),沒有
      # 額外插入任何「暫停流量」的步驟——Cloud Run 沒有這種機制,插入
      # 一個不會真正暫停流量的假動作只會拉長總時間、徒增複雜度。

      - name: Deploy/update tripace-migrate Cloud Run Job
        run: |
          gcloud run jobs deploy ${{ env.MIGRATE_JOB_NAME }} \
            --image=${{ env.MIGRATE_IMAGE }}:${{ github.sha }} \
            --region=${{ env.CLOUD_RUN_REGION }} \
            --set-cloudsql-instances=${{ env.CLOUDSQL_INSTANCE }} \
            --update-secrets=DATABASE_URL=DATABASE_URL:latest \
            --args="$(echo '${{ inputs.migration_cli_args }}' | tr ' ' ',')" \
            --max-retries=0 \
            --task-timeout=300 \
            --quiet

      - name: Execute database migration now
        run: |
          gcloud run jobs execute ${{ env.MIGRATE_JOB_NAME }} \
            --region=${{ env.CLOUD_RUN_REGION }} \
            --wait \
            --quiet

      # 遷移一旦執行完成(上一步 --wait 已確保跑完),立刻部署新版
      # tripace-server 接手,不停留、不做其他事。這是整支 workflow 裡
      # 唯一真正影響正式站流量的一步。
      - name: Deploy new tripace-server immediately after migration
        run: |
          gcloud run deploy ${{ env.CLOUD_RUN_SERVICE }} \
            --image=${{ env.SERVER_IMAGE }}:${{ github.sha }} \
            --region=${{ env.CLOUD_RUN_REGION }} \
            --allow-unauthenticated \
            --add-cloudsql-instances=${{ env.CLOUDSQL_INSTANCE }} \
            --update-env-vars=DEV_MODE=false,SEED=false,AI_PROVIDER=googleapis,AI_MODEL=gemini-2.5-flash-lite \
            --update-secrets=DATABASE_URL=DATABASE_URL:latest,JWT_SECRET=JWT_SECRET:latest,GOOGLE_API_KEY=GOOGLE_API_KEY:latest,GOOGLE_PLACES_API_KEY=GOOGLE_PLACES_API_KEY:latest \
            --quiet

      - name: Show deployment summary
        run: |
          URL=$(gcloud run services describe ${{ env.CLOUD_RUN_SERVICE }} \
            --region ${{ env.CLOUD_RUN_REGION }} \
            --format 'value(status.url)')
          echo "### 部署完成(含資料庫遷移)" >> "$GITHUB_STEP_SUMMARY"
          echo "遷移參數: \`${{ inputs.migration_cli_args }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Cloud Run URL: $URL" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${{ steps.backup.outputs.backup_uri }}" ]; then
            echo "備份檔案位置: \`${{ steps.backup.outputs.backup_uri }}\`" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "Migrate Job log: https://console.cloud.google.com/run/jobs/details/${{ env.CLOUD_RUN_REGION }}/${{ env.MIGRATE_JOB_NAME }}/executions?project=${{ env.GCP_PROJECT_ID }}" >> "$GITHUB_STEP_SUMMARY"
