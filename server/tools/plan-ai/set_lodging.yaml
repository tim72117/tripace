# onagent 平台上 plan-ai-timeline app 的 set_lodging tool 定義——見
# search_attraction.yaml 開頭的完整說明(app 背景、新版 CLI 格式規則、
# 為何拆成獨立檔案)。
#
# 2026-10-24:住宿不再是天裡 kind 為「住宿」的站點,改成獨立的一份資料(PlanTimeline.lodgings):
# N 筆旅館,每筆記錄停留的是哪幾天。AI 想的是「第幾天」,前端把天數轉成天的 id 再存。
# 同一個 placeId 已有旅館時視為更新它的停留日(upsert);days 傳空陣列代表移除。
# description 平台上限 600 字元,改完請重新估算長度。
#
# 推送(需要 onagent CLI,見 .claude/skills/onagent-cli-setup):
#   onagent tool create -api <onagent 後端 URL> plan-ai-timeline server/tools/plan-ai/set_lodging.yaml

name: set_lodging
description: >-
  設定一間旅館住哪幾天。住宿是獨立於各天景點的資料，不要用
  add_attraction 加住宿站。days 是從 1 起算的「第幾天」陣列，含入住日
  與退房日，可以不連續，例如 [2,3,4]；畫面會在入住日（最小的那天）最上
  面顯示住宿橫幅。placeId 必須是 search_attraction 查到的旅館 placeId，
  不可編造。同一個 placeId（或 lodgingId）已有旅館時，視為更新它的停留
  日。days 傳空陣列代表移除這筆旅館。

  還沒讀過或使用者改動行程後，先 list_itinerary（回傳的 lodgings 是目前
  的旅館）。days 只能是現有的天（不會自動補天，補天用 add_day）；超出範圍
  會回傳錯誤並說明目前有幾天，請查現況後重試，不要用相同參數再呼叫。
  成功回傳 {"lodgingId","days","updated","dayCount"}；移除回傳
  {"removed":true,"lodgingId"}。
kind: query
parameters:
  type: object
  properties:
    placeId:
      type: string
      description: 旅館的 Google Place ID（search_attraction 回傳的 placeId），不可編造。
    days:
      type: array
      items:
        type: integer
      description: 住哪幾天（從 1 起算的第幾天，含入住日與退房日，可不連續）；傳空陣列代表移除這筆旅館。
    name:
      type: string
      description: 旅館顯示名稱，選填；畫面優先用 placeId 查到的名稱，查不到才用這個。
    lodgingId:
      type: string
      description: 要更新的旅館 id（list_itinerary 的 lodgings 裡的 id），選填；省略時依 placeId 找同一間旅館。
  required:
    - placeId
    - days
