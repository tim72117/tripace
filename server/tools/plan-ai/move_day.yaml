# onagent 平台上 plan-ai-timeline app 的 move_day tool 定義——見
# search_attraction.yaml 開頭的完整說明(app 背景、新版 CLI 格式規則、
# 為何拆成獨立檔案)。
#
# 推送(需要 onagent CLI,見 .claude/skills/onagent-cli-setup):
#   onagent tool create -api <onagent 後端 URL> plan-ai-timeline server/tools/plan-ai/move_day.yaml

name: move_day
description: >-
  調整天的順序：把第 fromDay 天整天（連同裡面所有景點與備註）移到第
  toDay 天的位置，夾在中間的天依序順延一天。兩個參數都是從 1 起算的
  整數（第幾天），不是節點 id。例如 fromDay=3、toDay=1 會讓原本的第 3
  天變成第 1 天，原本的第 1、2 天各往後一天。

  只調整「天」的先後，每天裡面景點的順序與時間都不變；若要把單一景點
  換到另一天，請改用 remove_attraction 再 add_attraction（帶 day
  參數）。

  天數超出範圍時會回傳錯誤，並說明目前有幾天；請先呼叫 list_itinerary
  確認目前有幾天（回傳的 days 陣列每一項就是一天，day 是第幾天，空的天
  也會出現），再以實際存在的天數重試，不要用完全相同的參數再
  呼叫一次。成功回傳 {"fromDay": ..., "toDay": ..., "dayCount": 總天數}。
kind: query
parameters:
  type: object
  properties:
    fromDay:
      type: integer
      description: 要移動的那一天，目前是第幾天（從 1 起算）。
    toDay:
      type: integer
      description: 要移到第幾天的位置（從 1 起算）。
  required:
    - fromDay
    - toDay
