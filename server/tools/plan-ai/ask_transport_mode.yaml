# onagent 平台上 plan-ai-timeline app 的 ask_transport_mode tool 定義——
# 見 search_attraction.yaml 開頭的完整說明(app 背景、新版 CLI 格式規則、
# 為何拆成獨立檔案)。
#
# 2026-10 新增(使用者明確要求「使用相同的 ask page 外殼,但是內部的
# 詢問元件可以搭配不同的工具顯示不同的項目,目前有選擇旅遊區域,交通
# 方式,感興趣地點三種不同的工具」)——跟 open_ask_page/ask_travel_region
# 共用同一個前端外殼元件(web/src/home/plan-ai-sim/AskPage.tsx),但這支
# 工具顯示的是交通方式單選選項。
#
# 跟 ask_travel_region 不同:交通方式的選項值是前端固定列舉
# (walk/scooter/car/transit/bike,見
# web/src/plan-core/askPageTools.ts TransportMode 的完整說明),不是
# 由你自訂名稱——modes 參數只用來控制「顯示哪些、依什麼順序」,不能
# 傳列舉以外的值(傳了會被前端過濾掉)。省略 modes 時顯示全部五種、
# 依預設順序(步行/機車/開車/大眾運輸/腳踏車)。
#
# kind: query——回傳值(使用者選中的交通方式)必須被 LLM 看到才有意義。
# 單選,理由同 ask_travel_region:一段行程通常只用一種交通方式。
#
# 2026-10(第二輪,使用者明確要求「工具輸出參數加上文字敘述」「多一個
# 欄位,讓 AI 說明意圖」「要顯示在 AskPage 畫面上」):新增選填的 reason
# 參數,取代前端原本寫死的標題「這段要怎麼移動?」,讓這句話能反映這次
# 詢問真正的脈絡。
#
# 推送(需要 onagent CLI,見 .claude/skills/onagent-cli-setup):
#   onagent tool create -api <onagent 後端 URL> plan-ai-timeline server/tools/plan-ai/ask_transport_mode.yaml

name: ask_transport_mode
description: >-
  打開「詢問頁」，顯示交通方式選項讓使用者直接點選一個，取代文字一來
  一回詢問「這段路要怎麼移動」。適合安排連續站點之間、或整段行程的
  交通方式還不確定時主動呼叫；使用者已明確說出交通方式時不要呼叫。
  modes 選填，用來篩選/排列要顯示哪些交通方式（值只能是
  walk/scooter/car/transit/bike 這五種固定列舉之一，不能自訂其他值），
  省略時顯示全部五種、依預設順序。單選。
  呼叫這個工具之後這一輪你的工作就結束了——選單會顯示在畫面上，但這個
  工具不等使用者點選，也不會把他選了什麼回傳給你：
  工具會立刻回傳「選單已顯示、正在等待使用者點選」，不會等使用者選完，
  也不會把使用者選了什麼回傳給你。這一輪你已經做完該做的事，不需要
  重複呼叫這個工具、改個說法再問一次、或用文字追問要選哪一個。使用者
  點選之後，系統會送一則新的訊息通知你，那時才是你接續處理的
  時機。
  reason 選填，用一句話說明這次詢問的意圖，會取代畫面上原本固定
  的標題文字。
kind: query
parameters:
  type: object
  properties:
    modes:
      type: array
      description: >-
        要顯示的交通方式子集與順序，值限定 walk（步行）/scooter（機車）/
        car（開車）/transit（大眾運輸）/bike（腳踏車），省略或留空時顯示
        全部五種、依預設順序。
      items:
        type: string
    reason:
      type: string
      description: 選填，一句話說明這次詢問的意圖，會取代畫面上原本固定的標題文字（例如「這段路比較遠，選個交通方式吧」）。
