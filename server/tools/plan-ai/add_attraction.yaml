# onagent 平台上 plan-ai-timeline app 的 add_attraction tool 定義——見
# search_attraction.yaml 開頭的完整說明(app 背景、新版 CLI 格式規則、
# 為何拆成獨立檔案)。
#
# 推送(需要 onagent CLI,見 .claude/skills/onagent-cli-setup):
#   onagent tool create -api <onagent 後端 URL> plan-ai-timeline server/tools/plan-ai/add_attraction.yaml

name: add_attraction
description: >-
  把一個景點加入行程時間軸。placeId 必須是 search_attraction 的 nearby
  清單回傳過的 placeId，或使用者剛提到的地點本身查詢結果的 placeId，
  不要自己編造。anchorId 是要插在哪個既有節點「後面」——省略或傳 "null"
  代表插在最前面；要接在某個已加入的站點之後，傳那個站點呼叫成功後回傳
  結果裡的 id 欄位（不是 placeId——這兩者是不同的識別碼，不能互相
  替代）。呼叫成功後會回傳 {"id": "...", "time": "...", "anchorId":
  "..."}，請記住這個 id，之後要接在這一站後面時當 anchorId 使用。time
  選填，格式 "HH:MM"。若回傳錯誤（例如時間不在合理範圍、錨點不存在），
  錯誤訊息會直接告知合理的邊界值、或目前時間軸上實際可用的 anchorId
  清單，請依照建議調整參數後重試，不要用完全相同的參數再呼叫一次。
kind: query
parameters:
  type: object
  properties:
    anchorId:
      type: string
      description: 要插入在這個節點 id 之後（必須是先前某次 add_attraction 成功後回傳的 id）；省略或傳 "null" 代表插在時間軸最前面。
    placeId:
      type: string
      description: search_attraction 回傳的景點候選 placeId，或該工具查詢結果本身的 placeId。
    time:
      type: string
      description: 到達時間，格式 "HH:MM"，選填。
  required:
    - placeId
