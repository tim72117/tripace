# onagent 平台上 plan-ai-timeline app 的 add_attraction tool 定義——見
# search_attraction.yaml 開頭的完整說明(app 背景、新版 CLI 格式規則、
# 為何拆成獨立檔案)。
#
# 推送(需要 onagent CLI,見 .claude/skills/onagent-cli-setup):
#   onagent tool create -api <onagent 後端 URL> plan-ai-timeline server/tools/plan-ai/add_attraction.yaml

name: add_attraction
description: >-
  把一個景點加入行程時間軸。

  行動前先 list_itinerary 讀現況，再決定 anchorId、time、day。還沒讀
  過、或使用者改動行程（刪站、拖曳改時間）後才需要重讀；你自己剛做的
  變更不用重讀，可直接加下一站。一次只呼叫一個改動工具，成功後再呼叫
  下一個（同一輪平行呼叫彼此看不到結果，易用過期參數失敗）。

  placeId 必須是 search_attraction 回傳過的 placeId，或使用者提到的
  地點本身查詢結果的 placeId，不可編造。anchorId 是要插在哪個節點
  「後面」，省略或 "null" 代表該天最前面；要接在已加入的站點後，傳
  該站成功後回傳的 id（不是 placeId）。time 選填 "HH:MM"。day 選填
  （第幾天，從 1 起算），省略時放進 anchorId 所在那天，天數不足會自動
  補；一次最多往後跳 5 天（不得超過目前天數 + 5），超過會回傳錯誤。成功回傳 {"id","time","anchorId","day"}，之後當 anchorId 用。
  回傳錯誤時，依訊息建議的邊界值或可用 anchorId 調整後重試，不要用相同
  參數再呼叫。
kind: query
parameters:
  type: object
  properties:
    anchorId:
      type: string
      description: 要插入在這個節點 id 之後（必須是先前某次 add_attraction 成功後回傳的 id）；省略或傳 "null" 代表插在時間軸最前面。
    placeId:
      type: string
      description: search_attraction 回傳的景點候選 placeId，或該工具查詢結果本身的 placeId。
    time:
      type: string
      description: 到達時間，格式 "HH:MM"，選填。
    day:
      type: integer
      description: 放進第幾天（從 1 起算），選填；省略時放進 anchorId 所在的那一天。
  required:
    - placeId
