<!doctype html>

  <head>
    <!-- Google Tag Manager
         下方判斷式讀的環境變數,關閉分析追蹤時整段容器載入直接跳過
         ——原本 analytics.ts 的 trackEvent no-op 只能排除「自訂事件」
         (點擊/登入等),GTM 容器本身是這段純靜態 script,在任何 React/
         Vite 程式碼執行之前就已載入,即使排除了 trackEvent,GTM 容器
         仍會自動觸發預設的 pageview 事件,本機開發瀏覽任何頁面(含
         新增的 landing page,如台南介紹頁)都會被算進正式環境的
         GA4/Ads 流量統計。判斷式裡那個帶 % 的 token 是 Vite 對
         index.html 的建置期字串替換語法(讀 .env 系列檔案,dev/build
         皆支援)——這則註解刻意不把該 token 逐字寫出來,寫出來會被
         同一套替換機制連同註解文字一起代換掉,讀起來語意不通(曾經
         踩過)。把判斷收在這裡,而非只排除 dataLayer.push 這一個
         進入點——見 src/analytics.ts trackEvent 的完整說明,兩處排除
         機制互補:這裡擋容器載入本身(連 gtm.js 都不會發出請求),
         analytics.ts 擋自訂事件(容器已載入、但正式環境才該計入的
         互動事件仍不誤觸發)。 -->
    <script>
      if ('%VITE_DISABLE_ANALYTICS%' !== '1') {
        (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
        new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
        j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
        'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
        })(window,document,'script','dataLayer','GTM-563D8TXG');
      }
    </script>
    <!-- End Google Tag Manager -->
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover:讓內容延伸到 iPhone 瀏海/home indicator 這類安全區之外,
         CSS 的 env(safe-area-inset-*) 才會回傳實際值(否則 iOS Safari 一律算成 0,
         底部常駐列/浮動卡片的 safe-area padding 會完全失效)。

         maximum-scale=1, user-scalable=no:鎖住整站手動縮放,這是刻意的取捨
         (使用者明確選擇這個做法,而非只調整觸發自動放大的那個輸入框
         font-size)——iOS Safari 對 font-size < 16px 的 <input> focus 時
         會自動放大整頁面(避免使用者看不清楚輸入內容),規劃地圖的城市
         搜尋框(GeoOutlineMap.module.css 的 .citySearchInput,13px)就是
         這樣被觸發。放行縮放的代價是使用者失去手動放大頁面的無障礙能力,
         換來的是不會有「點某些輸入框頁面突然跳一下」的不一致體感。

         2026-08 曾經嘗試加 interactive-widget=resizes-content(CSS
         Viewport Module Level 1 規範,想讓虛擬鍵盤彈出時瀏覽器把它當成
         真正縮小 layout viewport 處理,不再需要 JS 反向修正)解決聊天室
         輸入框聚焦時「上方內容被往上推」的問題——實測(手機真機 Safari
         console)確認 Safari 印出「Viewport argument key
         "interactive-widget" not recognized and ignored」,查證後
         確認這不是版本問題,是 Safari 整個瀏覽器引擎目前完全沒有實作
         這個屬性(WebKit 有一個追蹤這個功能的 open bug #259770,尚未
         完成),只有 Chrome 108+/Firefox 132+ 支援,對 iOS Safari 完全
         無效,故已移除,改回 chat/ChatScreen.tsx 的 window.visualViewport
         JS 方案(見該檔案的說明)。 -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- 下面這份 canonical/og:url/og:image/twitter:image 寫死的網域
         (https://tripace.io)是「預設值/placeholder」,不是真正的單一
         事實來源——真正的事實來源是 server 端環境變數 SITE_BASE_URL
         (見 server/cmd/server/seo_meta.go 的 siteBaseURL()/
         defaultCanonical/defaultImage)。cmd/server 的 staticHandler
         回應每個請求時,會把這裡的值跟 siteBaseURL() 組出來的值做字串
         完全比對,找到就取代成該路由自己的 SEO meta(見 applySEOMeta/
         checkIndexHTMLHasAllSEOTargets 的完整說明)。

         這裡故意不用 Vite 的 %VITE_XXX% 建置期字串注入(例如
         %VITE_SITE_BASE_URL%)——那個機制只會在「vite build 這一次」
         把值寫進 dist/index.html,之後這份靜態檔案就定型了;而
         上述字串比對取代是在「每次 HTTP 請求進來時」用當下環境變數
         跑一次,同一個 build 產物可以在不同環境(本機/預發布/正式)
         讀到不同的 SITE_BASE_URL 而不必重新 build。兩個機制功能重疊、
         事實來源不該有兩個,故留在這裡的值只當作需要跟 Go 端逐字比對
         的 placeholder,改網域時只需要改 SITE_BASE_URL 環境變數(見
         server/.env.example),不需要同步改這份檔案——除非連這份
         placeholder 本身的字串格式都要變,那種情況才需要跟著改這裡,
         並同步更新 seo_meta.go 的 defaultCanonical/defaultImage。 -->
    <link rel="canonical" href="https://tripace.io/" />
