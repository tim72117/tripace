# onagent 平台上 blog-article-writer app 的 list_photos tool 定義。
# 前端實作:web/src/blog/articleTools.ts(listPhotos)。app 背景與用法見 onagent-thought-blog-article.yaml。
# 推送(需要 onagent CLI,見 .claude/skills/onagent-cli-setup):
#   onagent tool create -api <onagent 後端 URL> blog-article-writer web/tools/blog-article/list_photos.yaml
# description 平台上限 600 字元,改完請重新估算長度。

name: list_photos
description: >-
  列出使用者素材庫裡「已處理完成」的圖片(每次呼叫都重新讀取),每張回傳
  photoId、note(場景描述,空字串=沒有備註)、rating(1~3,null=未評分)、
  orientation(portrait 直式 / landscape 橫式);withoutNote 是沒有備註的張數。
  另有 staged:使用者已選檔、尚未上傳的圖片(stagedKey、filename、note),
  它們沒有 photoId,不能放進文章,請使用者先按「上傳」再重新呼叫本工具。
  add_block 的 photoId 只能用 photos 裡的值,不可編造。沒有備註的圖不要
  亂猜內容,可以跳過,或請使用者先補備註。
kind: query
parameters:
  type: object
  properties: {}
