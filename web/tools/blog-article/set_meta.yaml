# onagent 平台上 blog-article-writer app 的 set_meta tool 定義。
# 前端實作:web/src/blog/articleTools.ts(setMeta)。
# 推送:onagent tool create -api <onagent 後端 URL> blog-article-writer web/tools/blog-article/set_meta.yaml

name: set_meta
description: >-
  設定文章標題 title 與開頭導言 lede(兩者至少給一個,沒給的維持原樣)。
  只改編輯器畫面,使用者按「儲存」才會存。標題簡短有主題感;lede 是一小段
  整體介紹(約 1~3 句),不要重複內文。
kind: query
parameters:
  type: object
  properties:
    title:
      type: string
      description: 文章標題,選填。
    lede:
      type: string
      description: 開頭導言,選填。
