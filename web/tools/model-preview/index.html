<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>模型預覽</title>
<style>
  :root { --bg: #14161c; --panel: rgba(20, 22, 30, .82); --line: rgba(255,255,255,.14); --ink: #e8e6df; --muted: #9a9890; --accent: #ffc15a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 13px/1.5 -apple-system, BlinkMacSystemFont, 'PingFang TC', 'Noto Sans TC', sans-serif; overflow: hidden; }
  #stage { position: fixed; inset: 0; }
  canvas { display: block; }
  .bar { position: fixed; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; backdrop-filter: blur(8px); }
  #top { top: 12px; left: 12px; right: 12px; justify-content: space-between; }
  #bottom { left: 12px; bottom: 12px; }
  select, button { font: inherit; color: var(--ink); background: rgba(255,255,255,.07); border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; cursor: pointer; }
  button:hover, select:hover { background: rgba(255,255,255,.14); }
  button.on { background: var(--accent); color: #2a1a00; border-color: transparent; }
  .group { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  #info { color: var(--muted); font-variant-numeric: tabular-nums; }
  #status { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }
  #dot { width: 8px; height: 8px; border-radius: 50%; background: #c0453a; }
  #dot.live { background: #5bbf6a; }
  #dot.flash { background: var(--accent); }
  #msg { position: fixed; inset: 0; display: none; place-content: center; text-align: center; color: var(--muted); padding: 24px; pointer-events: none; }
  #msg.show { display: grid; }
  #msg.err { color: #ff8a7a; }
  @media (max-width: 640px) { #top { flex-direction: column; align-items: stretch; } }
</style>
</head>
<body>
<div id="stage"></div>
<div id="msg"></div>
<div class="bar" id="top">
  <div class="group">
    <select id="file" aria-label="選擇模型"></select>
    <span id="status"><span id="dot"></span><span id="statusText">連線中…</span></span>
  </div>
  <div class="group" id="info"></div>
</div>
<div class="bar" id="bottom">
  <div class="group" id="views">
    <button data-view="front">正面</button>
    <button data-view="side">側面</button>
    <button data-view="iso">斜 45°</button>
    <button data-view="low">低角度</button>
    <button data-view="top">俯視</button>
  </div>
  <div class="group">
    <button id="wire">線框</button>
    <button id="bbox">邊界框</button>
    <button id="human">比例人</button>
  </div>
  <div class="group" id="lights">
    <button data-light="day" class="on">白天</button>
    <button data-light="dusk">黃昏</button>
    <button data-light="night">夜晚</button>
  </div>
</div>
<script type="importmap">
{ "imports": { "three": "/vendor/three/build/three.module.js", "three/addons/": "/vendor/three/examples/jsm/" } }
</script>
<script type="module" src="/viewer.js"></script>
</body>
</html>
