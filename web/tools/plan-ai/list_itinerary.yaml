# onagent 平台上 plan-ai-timeline app 的 list_itinerary tool 定義——見
# search_attraction.yaml 開頭的完整說明(app 背景、新版 CLI 格式規則、
# 為何拆成獨立檔案)。
#
# 2026-09 真實踩坑記錄(見 server/tmp/logs 底下實際對話紀錄):LLM 在
# 完全不知道時間軸現況的情況下,單靠自己記住的對話上下文猜測某個節點
# 的 anchorId 與其後一站的時間關係——一次真實案例裡,LLM 已經呼叫
# add_attraction 插入「台南孔廟」(插在最前面,成為新的 head),但它不
# 知道原本的 head「赤崁樓」因此變成孔廟的下一站,之後想在孔廟後面插入
# 一個較晚的時間時,連續 4 次收到一模一樣的 time_out_of_range 錯誤,
# 因為它沒有能力自己查詢「孔廟後面接的到底是哪一站」,只能不斷用同樣
# 的參數重試。這個工具補上這個查詢現況的能力。
#
# 2026-10-24:時間軸改成依天分組。回傳 { days: [{ day, steps: [...] }] }(依天分組,空的天 steps 為空陣列),
# 不再有 section 分隔節點,節點本身也不再帶 day(天由外層分組表達)。
#
# 2026-10-24(住宿獨立存放):回傳新增 lodgings: [{ id, placeId, name, days }],days 是由位置推算的第幾天(含入住與退房日)。
# 住宿不再出現在 days 的 steps 裡,要設定/移除用 set_lodging / remove_lodging。
#
# 2026-10-24(對話獨立):對話訊息不再是時間軸節點(前端改存獨立的對話資料),steps 只剩景點,
# 因此 step 不再回傳 type 欄位(以前是 stop 或 message)。
# description 平台上限 600 字元,改完請重新估算長度。
#
# 無參數(parameters.properties 為空物件)——這個工具不需要任何輸入,
# 每次呼叫都回傳目前完整的時間軸現況。
#
# kind: query——LLM 需要看到查詢結果(現有節點清單)才能接著決定要用
# 哪個 id 當 anchorId,不能是 action(fire-and-forget)。
#
# 推送(需要 onagent CLI,見 .claude/skills/onagent-cli-setup):
#   onagent tool create -api <onagent 後端 URL> plan-ai-timeline web/tools/plan-ai/list_itinerary.yaml

name: list_itinerary
description: >-
  查詢目前行程，回傳 {days: [{day, steps}], lodgings: [{id, placeId, name,
  days}]}。days 依「天」分組，day 從 1 起算，空的天也會出現（steps 為
  空陣列）；step 有 id（add_note 的 anchorId 就是這個值）、time、kind、
  duration、placeId、name、note，依該天實際順序排列。要把景點排進空的天，用 add_attraction 的 day 參數、anchorId 省略。
  lodgings 是住宿（獨立於各天景點），days 是住的第幾天，用
  set_lodging / remove_lodging 改。

  不要單靠對話記憶，以下情況呼叫：
  1. 第一次改動行程（add_attraction、add_note、remove_attraction、
     add_day、move_day、set_lodging、remove_lodging）之前，以及使用者改
     動行程後（刪站、拖曳）。你自己剛做的變更不用重讀。
  2. 收到 anchor_not_found 或 time_out_of_range 後。
  3. 使用者問目前排了什麼時。
kind: query
parameters:
  type: object
  properties: {}
